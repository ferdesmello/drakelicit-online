name: Update data

# Monthly (1st of the month, 03:17 UTC) AND on demand:
# repo -> Actions tab -> "Update data" -> "Run workflow".
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write     # commit the data files and figures
  pages: write        # ask Pages for a rebuild after the commit (see last step)

# never two runs at once (the workflow is the only writer of data/ and figures/)
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # continue-on-error: even if the import fails (Sheet link broken, Google down...)
      # the keepalive commit below still happens; the job is marked failed at the end.
      - name: Import new submissions and recompute the community curve
        id: update
        continue-on-error: true
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python scripts/update_data.py

      # Public figures and summary tables from the refreshed data (data/part-*.csv).
      - name: Run survey analysis
        id: analysis
        if: steps.update.outcome == 'success'
        continue-on-error: true
        run: |
          python analysis/drake_survey_analysis.py \
            --data-dir data \
            --questions questions.json \
            --out-dir figures

      # Exploratory comparison by field of study. It stops on purpose while either group
      # (Biológicas, Exatas) has fewer than 5 people, so a failure here is NOT an error:
      # it is not counted in the final "fail the run" step.
      - name: Run analysis by area
        id: by_area
        if: steps.update.outcome == 'success'
        continue-on-error: true
        run: |
          python analysis/drake_survey_by_area.py \
            --data-dir data \
            --questions questions.json \
            --out-dir figures

      # KEEPALIVE: GitHub disables scheduled workflows after 60 days without repository
      # activity. data/last_run.txt changes on every run, so every run is a commit.
      - name: Keepalive and commit
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) import=${{ steps.update.outcome }} analysis=${{ steps.analysis.outcome }} by_area=${{ steps.by_area.outcome }}" > data/last_run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data figures
          git commit -m "Update data ($(date -u +%F))" || echo "nothing to commit"
          git pull --rebase
          git push

      # A push made with the built-in token may not trigger the Pages build by itself.
      # This asks for one explicitly; harmless if Pages already started a build.
      - name: Request a Pages build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

      - name: Fail the run if the import or the main analysis failed
        if: steps.update.outcome == 'failure' || steps.analysis.outcome == 'failure'
        run: |
          if [ "${{ steps.update.outcome }}" = "failure" ]; then
            echo "::error::scripts/update_data.py failed; see the import step above."
          fi
          if [ "${{ steps.analysis.outcome }}" = "failure" ]; then
            echo "::error::analysis/drake_survey_analysis.py failed; see the analysis step above."
          fi
          exit 1
